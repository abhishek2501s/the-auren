<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE AUREN | Luxury Pret & Streetwear</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background-color: #0f0f0f; color: #f5f5f5; padding-bottom: 70px; }
    
    /* Luxury Minimalist Navbar */
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: #0f0f0f; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
    .brand-logo { font-size: 20px; font-weight: 600; letter-spacing: 4px; color: #fff; text-decoration: none; text-transform: uppercase; }
    .nav-links { list-style: none; display: flex; gap: 25px; }
    .nav-links a { color: #aaa; text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; transition: color 0.3s; }
    .nav-links a:hover { color: #fff; }
    
    /* Clean Hero Section */
    .hero { height: 50vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=80') center/cover; padding: 0 20px; }
    .hero h1 { font-size: 32px; letter-spacing: 5px; font-weight: 400; margin-bottom: 10px; text-transform: uppercase; }
    .hero p { color: #bbb; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
    
    /* Products Grid */
    .products { padding: 50px 6%; }
    .products h2 { font-size: 18px; margin-bottom: 35px; text-align: center; letter-spacing: 3px; font-weight: 500; text-transform: uppercase; color: #ccc; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; }
    .product-card { background: #141414; padding: 12px; border: 1px solid #222; transition: border-color 0.3s; }
    .product-card:hover { border-color: #444; }
    .product-card img { width: 100%; height: 320px; object-fit: cover; }
    .product-card h3 { font-size: 14px; font-weight: 400; margin: 15px 0 6px; color: #e0e0e0; letter-spacing: 1px; }
    .price { font-size: 14px; font-weight: 500; color: #fff; margin-bottom: 15px; letter-spacing: 1px; }
    
    /* Minimal Luxury Buttons */
    .btn-group { display: flex; gap: 10px; }
    .btn-cart { flex: 1; background: transparent; color: #fff; border: 1px solid #444; padding: 10px; font-size: 11px; font-weight: 500; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: all 0.3s; }
    .btn-cart:hover { background: #fff; color: #000; border-color: #fff; }
    .btn-buy { flex: 1; background: #fff; color: #000; text-align: center; text-decoration: none; padding: 10px; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
    .btn-buy:hover { background: #d4d4d4; }
    
    /* Floating Cart Bar */
    .cart-float { position: fixed; bottom: 20px; left: 5%; right: 5%; max-width: 400px; margin: 0 auto; background: #1a1a1a; border: 1px solid #333; padding: 14px 20px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 999; }
    .cart-info { font-size: 12px; font-weight: 500; letter-spacing: 1px; }
    .cart-checkout-btn { background: #fff; color: #000; border: none; padding: 8px 16px; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }

    footer { text-align: center; padding: 30px 20px; background: #0f0f0f; color: #666; font-size: 11px; letter-spacing: 1px; border-top: 1px solid #222; margin-top: 50px; text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="#" class="brand-logo">THE AUREN</a>
      <ul class="nav-links">
        <li><a href="#collection">Collection</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <h1>NEW SEASON</h1>
    <p>Luxury Pret & Contemporary Wear</p>
  </section>

  <section id="collection" class="products">
    <h2>The Edit</h2>
    <div class="product-grid">

      <!-- Product 1 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80" alt="Oversized Hoodie">
        <h3>Structured Black Hoodie</h3>
        <p class="price">₹1,499</p>
        <div class="btn-group">
          <button class="btn-cart" onclick="addToCart('Structured Black Hoodie', 1499)">Add to Bag</button>
          <a class="btn-buy" href="https://wa.me/918447311105?text=Hi%20THE%20AUREN,%20I%20want%20to%20buy%20the%20Structured%20Black%20Hoodie" target="_blank">Buy Now</a>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1520975954732-35dd22299614?auto=format&fit=crop&w=600&q=80" alt="Suede Jacket">
        <h3>Minimalist Suede Jacket</h3>
        <p class="price">₹2,999</p>
        <div class="btn-group">
          <button class="btn-cart" onclick="addToCart('Minimalist Suede Jacket', 2999)">Add to Bag</button>
          <a class="btn-buy" href="https://wa.me/918447311105?text=Hi%20THE%20AUREN,%20I%20want%20to%20buy%20the%20Minimalist%20Suede%20Jacket" target="_blank">Buy Now</a>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80" alt="White Tee">
        <h3>Signature Heavyweight Tee</h3>
        <p class="price">₹799</p>
        <div class="btn-group">
          <button class="btn-cart" onclick="addToCart('Signature Heavyweight Tee', 799)">Add to Bag</button>
          <a class="btn-buy" href="https://wa.me/918447311105?text=Hi%20THE%20AUREN,%20I%20want%20to%20buy%20the%20Signature%20Heavyweight%20Tee" target="_blank">Buy Now</a>
        </div>
      </div>

    </div>
  </section>

  <!-- Floating Bag Bar -->
  <div id="cartBar" class="cart-float" style="display: none;">
    <div class="cart-info" id="cartCount">0 Items | ₹0</div>
    <button class="cart-checkout-btn" onclick="checkoutCart()">Checkout (WhatsApp)</button>
  </div>

  <footer>
    <p>© 2026 THE AUREN. All rights reserved.</p>
  </footer>

  <script>
    let myCart = [];

    function addToCart(name, price) {
      myCart.push({ name: name, price: price });
      updateCartDisplay();
    }

    function updateCartDisplay() {
      let bar = document.getElementById('cartBar');
      let countText = document.getElementById('cartCount');
      if (myCart.length > 0) {
        bar.style.display = 'flex';
        let total = myCart.reduce((sum, item) => sum + item.price, 0);
        countText.innerText = myCart.length + " Items | ₹" + total;
      }
    }

    function checkoutCart() {
      if (myCart.length === 0) return;
      let total = myCart.reduce((sum, item) => sum + item.price, 0);
      let itemsList = myCart.map(i => i.name + " (₹" + i.price + ")").join(", ");
      let msg = "Hi THE AUREN, I want to order the following items from my bag:\n\n" + itemsList + "\n\n*Total Amount:* ₹" + total;
      window.open("https://wa.me/918447311105?text=" + encodeURIComponent(msg), "_blank");
    }
  </script>

</body>
</html>
