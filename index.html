<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE AUREN | Luxury Apparel</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: #0b0b0b;
      --card-bg: #121212;
      --border: #222222;
      --text: #ffffff;
      --muted: #888888;
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 11, 11, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Cinzel', serif;
      letter-spacing: 4px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .nav-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 4px;
      transition: 0.2s ease;
    }

    .nav-btn:hover {
      opacity: 0.7;
    }

    .cart-badge {
      background: #fff;
      color: #000;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 4px;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 60px 20px 30px;
    }

    .hero h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.4rem;
      letter-spacing: 6px;
      font-weight: 400;
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Grid */
    .catalog {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #333;
    }

    .card-img {
      width: 100%;
      height: 340px;
      object-fit: cover;
      background: #1a1a1a;
    }

    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .card-price {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .add-btn {
      margin-top: auto;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 2px;
      transition: opacity 0.2s;
    }

    .add-btn:hover {
      opacity: 0.85;
    }

    /* Modals */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .modal {
      background: #141414;
      border: 1px solid var(--border);
      padding: 30px;
      width: 100%;
      max-width: 420px;
      border-radius: 6px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      position: relative;
    }

    .modal h3 {
      font-family: 'Cinzel', serif;
      letter-spacing: 3px;
      font-size: 1.2rem;
      margin-bottom: 8px;
      text-align: center;
    }

    .modal-sub {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .field {
      width: 100%;
      padding: 12px 14px;
      background: #0b0b0b;
      border: 1px solid var(--border);
      color: #fff;
      font-size: 0.9rem;
      border-radius: 4px;
      margin-bottom: 14px;
      outline: none;
    }

    .field:focus {
      border-color: #555;
    }

    .primary-btn {
      width: 100%;
      background: #fff;
      color: #000;
      padding: 12px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 4px;
    }

    .status-msg {
      margin-top: 14px;
      font-size: 0.8rem;
      text-align: center;
      color: #aaa;
      min-height: 18px;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
    }

    /* Cart Sidebar / Drawer */
    .cart-drawer {
      position: fixed;
      right: -100%;
      top: 0;
      width: 100%;
      max-width: 380px;
      height: 100%;
      background: #111;
      border-left: 1px solid var(--border);
      z-index: 1000;
      transition: 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .cart-drawer.open {
      right: 0;
    }

    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
      margin: 20px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      font-size: 0.85rem;
    }

    .cart-total {
      border-top: 1px solid #333;
      padding-top: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="logo">THE AUREN</a>
    <div class="nav-actions">
      <button class="nav-btn" id="auth-btn" onclick="openAuthModal()">MEMBER ACCESS</button>
      <button class="nav-btn" onclick="toggleCart()">
        BAG <span id="cart-count" class="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- Hero -->
  <div class="hero">
    <h1>AUTUMN / WINTER 26</h1>
    <p>Exclusive Haute Couture & Streetwear</p>
  </div>

  <!-- Product Catalog -->
  <div class="catalog" id="catalog-grid"></div>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cart-drawer">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="font-family: 'Cinzel', serif; letter-spacing: 2px;">YOUR SELECTION</h3>
      <button class="close-btn" style="position: static;" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-list"></div>
    <div class="cart-total">
      <span>TOTAL</span>
      <span id="cart-total-amount">₹0</span>
    </div>
    <button class="primary-btn" onclick="openCheckout()">PROCEED TO ORDER</button>
  </div>

  <!-- Auth Modal (OTP) -->
  <div class="overlay" id="auth-modal">
    <div class="modal">
      <button class="close-btn" onclick="closeAuthModal()">&times;</button>
      <h3>MEMBER ACCESS</h3>
      <p class="modal-sub">Enter your phone number to receive an exclusive verification passcode.</p>

      <!-- Step 1: Phone -->
      <div id="phone-box">
        <input type="tel" id="phone-number" class="field" placeholder="+91 9876543210" />
        <div id="recaptcha-container"></div>
        <button class="primary-btn" onclick="handleSendOTP()">REQUEST PASSCODE</button>
      </div>

      <!-- Step 2: OTP (Hidden) -->
      <div id="otp-box" style="display: none;">
        <input type="text" id="otp-code" class="field" placeholder="6-digit code" maxlength="6" />
        <button class="primary-btn" onclick="handleVerifyOTP()">VERIFY & ENTER</button>
      </div>

      <p class="status-msg" id="auth-status"></p>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div class="overlay" id="checkout-modal">
    <div class="modal">
      <button class="close-btn" onclick="closeCheckout()">&times;</button>
      <h3>DISPATCH DETAILS</h3>
      <p class="modal-sub">Provide delivery details. Order confirmation will be delivered directly to the store manager.</p>
      
      <input type="text" id="cust-name" class="field" placeholder="Full Name" />
      <input type="text" id="cust-address" class="field" placeholder="Complete Shipping Address with PIN" />
      <input type="text" id="cust-city" class="field" placeholder="City & State" />
      
      <button class="primary-btn" onclick="submitFinalOrder()">CONFIRM & DISPATCH</button>
    </div>
  </div>

  <script>
    /* -------------------------------------------------------------
       1. FIREBASE SETUP & INITIALIZATION
    ------------------------------------------------------------- */
    const firebaseConfig = {
      apiKey: "AIzaSyAk3Sop3X1JfEZxnG0D_jFTF0_9xmV23H8",
      authDomain: "the-auren-auth.firebaseapp.com",
      projectId: "the-auren-auth",
      storageBucket: "the-auren-auth.firebasestorage.app",
      messagingSenderId: "211517147742",
      appId: "1:211517147742:web:e1ed0407601df06b9a42cf"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Setup invisible Recaptcha
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      'size': 'invisible'
    });

    let confirmationResultGlobal = null;

    /* -------------------------------------------------------------
       2. PRODUCTS DATA
    ------------------------------------------------------------- */
    const products = [
      {
        id: "AUR-01",
        title: "Obsidian Boxy Hoodie",
        price: 3499,
        img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=800&auto=format&fit=crop&q=80"
      },
      {
        id: "AUR-02",
        title: "Monolith Oversized Tee",
        price: 1899,
        img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=800&auto=format&fit=crop&q=80"
      },
      {
        id: "AUR-03",
        title: "Tactical Cargo Pant",
        price: 4299,
        img: "https://images.unsplash.com/photo-1517445312882-bc9910d016b7?w=800&auto=format&fit=crop&q=80"
      }
    ];

    let cart = [];

    // Render Catalog
    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      grid.innerHTML = products.map(p => `
        <div class="card">
          <img src="${p.img}" alt="${p.title}" class="card-img" />
          <div class="card-body">
            <h4 class="card-title">${p.title}</h4>
            <p class="card-price">₹${p.price.toLocaleString('en-IN')}</p>
            <button class="add-btn" onclick="addToCart('${p.id}')">ADD TO SELECTION</button>
          </div>
        </div>
      `).join('');
    }

    /* -------------------------------------------------------------
       3. CART LOGIC
    ------------------------------------------------------------- */
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCartUI();
      toggleCart(true);
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      const list = document.getElementById('cart-list');
      if (cart.length === 0) {
        list.innerHTML = `<p style="color: #666; font-size: 0.85rem; text-align: center; margin-top: 40px;">Your selection is empty.</p>`;
        document.getElementById('cart-total-amount').innerText = "₹0";
        return;
      }
      
      let total = 0;
      list.innerHTML = cart.map((item, index) => {
        total += item.price;
        return `
          <div class="cart-item">
            <div>
              <div style="font-weight: 500;">${item.title}</div>
              <div style="color: #777;">₹${item.price.toLocaleString('en-IN')}</div>
            </div>
            <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#ff4d4d; cursor:pointer;">&times;</button>
          </div>
        `;
      }).join('');
      
      document.getElementById('cart-total-amount').innerText = `₹${total.toLocaleString('en-IN')}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function toggleCart(forceOpen = false) {
      const drawer = document.getElementById('cart-drawer');
      if (forceOpen) {
        drawer.classList.add('open');
      } else {
        drawer.classList.toggle('open');
      }
    }

    /* -------------------------------------------------------------
       4. AUTH (OTP) FUNCTIONS
    ------------------------------------------------------------- */
    function openAuthModal() {
      document.getElementById('auth-modal').style.display = 'flex';
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').style.display = 'none';
    }

    function handleSendOTP() {
      const phone = document.getElementById('phone-number').value.trim();
      const status = document.getElementById('auth-status');

      if (!phone.startsWith('+')) {
        status.innerText = "Please prefix country code (+91...)";
        return;
      }

      status.innerText = "Transmitting OTP...";
      
      auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
        .then((confirmationResult) => {
          confirmationResultGlobal = confirmationResult;
          document.getElementById('phone-box').style.display = 'none';
          document.getElementById('otp-box').style.display = 'block';
          status.innerText = "Passcode dispatched to " + phone;
        })
        .catch((error) => {
          status.innerText = error.message;
        });
    }

    function handleVerifyOTP() {
      const code = document.getElementById('otp-code').value.trim();
      const status = document.getElementById('auth-status');

      if (code.length !== 6) {
        status.innerText = "Enter valid 6-digit code";
        return;
      }

      status.innerText = "Verifying credentials...";
      confirmationResultGlobal.confirm(code)
        .then((result) => {
          const user = result.user;
          localStorage.setItem('auren_user', JSON.stringify({ phone: user.phoneNumber }));
          checkAuthState();
          status.innerText = "Access Granted.";
          setTimeout(() => {
            closeAuthModal();
          }, 800);
        })
        .catch((err) => {
          status.innerText = "Verification failed. Check passcode.";
        });
    }

    function checkAuthState() {
      const savedUser = localStorage.getItem('auren_user');
      const authBtn = document.getElementById('auth-btn');
      if (savedUser) {
        const parsed = JSON.parse(savedUser);
        authBtn.innerText = "PROFILE: " + parsed.phone.slice(-4);
        authBtn.onclick = () => {
          if (confirm("Disconnect Member Session?")) {
            localStorage.removeItem('auren_user');
            location.reload();
          }
        };
      }
    }

    /* -------------------------------------------------------------
       5. ORDER SUBMISSION & STORE OWNER SYNC
    ------------------------------------------------------------- */
    function openCheckout() {
      if (cart.length === 0) {
        alert("Select apparel before proceeding.");
        return;
      }
      
      // Require Login
      const savedUser = localStorage.getItem('auren_user');
      if (!savedUser) {
        toggleCart(false);
        openAuthModal();
        alert("Please authenticate membership via phone OTP first.");
        return;
      }

      toggleCart(false);
      document.getElementById('checkout-modal').style.display = 'flex';
    }

    function closeCheckout() {
      document.getElementById('checkout-modal').style.display = 'none';
    }

    function submitFinalOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const address = document.getElementById('cust-address').value.trim();
      const city = document.getElementById('cust-city').value.trim();
      const user = JSON.parse(localStorage.getItem('auren_user'));

      if (!name || !address || !city) {
        alert("Please fill all dispatch fields.");
        return;
      }

      const total = cart.reduce((acc, c) => acc + c.price, 0);
      const itemsList = cart.map(i => `- ${i.title} (₹${i.price})`).join('%0A');

      // Instant Order Forwarding to Store Owner's WhatsApp
      const STORE_PHONE = "918447311105";
      
      const message = `*NEW AUREN ORDER RECEIVED*%0A%0A` +
        `*Customer Name:* ${name}%0A` +
        `*Phone:* ${user.phone}%0A` +
        `*Delivery Address:* ${address}, ${city}%0A%0A` +
        `*Ordered Items:*%0A${itemsList}%0A%0A` +
        `*Total Value:* ₹${total.toLocaleString('en-IN')}%0A` +
        `*Status:* Pending Confirmation`;

      // Redirect directly to WhatsApp with pre-filled order
      window.open(`https://wa.me/${STORE_PHONE}?text=${message}`, '_blank');

      alert("Order Generated! Redirecting dispatch details to Auren Concierge...");
      cart = [];
      updateCartUI();
      closeCheckout();
    }

    // Init Page
    renderCatalog();
    updateCartUI();
    checkAuthState();
  </script>
</body>
</html>
